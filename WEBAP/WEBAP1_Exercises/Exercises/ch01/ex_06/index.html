<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Exercise 1.6</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
   $(document).ready(function ()
        {
            // #count always shows the number of open tasks
            function updateCount()
            {
                $("#count").text($("#list li").not(".done").length);
            }

            // Add: append text of #task as new <li>, clear field, ignore empty
            function addTask()
            {
                var text = $("#task").val().trim();
                if (text === "") return;

                $("#list").append($("<li>").text(text));
                $("#task").val("").focus();
                updateCount();
            }

            $("#add").click(addTask);

            // Enter in the field also adds the task
            $("#task").keydown(function (e)
            {
                if (e.key === "Enter") addTask();
            });

            // Click on a task toggles "done" (event delegation)
            $("#list").on("click", "li", function ()
            {
                $(this).toggleClass("done");
                updateCount();
            });

            // Remove completed tasks
            $("#clearDone").click(function ()
            {
                $("#list li.done").remove();
                updateCount();
            });

            updateCount();
        });
</script>

     
   


</head>

<body>
    <h2>Exercise 1.6 – To-do list</h2>
    <p>
        <input type="text" id="task" placeholder="New task">
        <button id="add">Add</button>
        <button id="clearDone">Remove completed tasks</button>
    </p>
    <p>Open tasks: <span id="count">0</span></p>
    <ul id="list"></ul>
</body>

</html>
