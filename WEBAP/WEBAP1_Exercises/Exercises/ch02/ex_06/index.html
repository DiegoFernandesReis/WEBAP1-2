<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A1 – Task 6</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function()
        {
            $("#welcome").click(function()
            {
                $("#output").html("<h2>Welcome</h2><p>Welcome to our website!</p>");
            });
            $("#news").click(function()
            {
                $("#output").html("<h2>News</h2><p>Check out our latest news!</p>");
            });
            $("#about").click(function()
            {
                $("#output").html("<h2>About</h2><p>Learn more about us!</p>");
            });
            $("#question").click(function()
            {
                $("#output").html("<h2>Question</h2><p>Have a question? Contact us!</p>");
            });
        });
    </script>
</head>
<body>
    <a href="#" id="welcome">Welcome</a> |
    <a href="#" id="news">News</a> |
    <a href="#" id="about">About</a> |
    <a href="#" id="question">Question</a>
    <div id="output"></div>
</body>
</html>
